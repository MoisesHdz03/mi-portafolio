<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/app.css">
    <title>Nuevo usuario | WhatsApp HSM</title>
</head>
<body>
<main class="main-content">
    <div class="encabezado">
        <div>
            <h1 id="titulo">Crear Usuario</h1>
            <p id="subtitulo">Da acceso a una persona al sistema de envíos.</p>
        </div>
        <div class="encabezado-acciones">
            <a href="users.html" class="btn btn-light"><i class="bi bi-arrow-left"></i> Usuarios</a>
        </div>
    </div>

    <div class="tarjeta" style="max-width: 640px">
        <form class="tarjeta-cuerpo" id="formUsuario">
            <div class="alert alert-danger py-2" id="error" hidden></div>
            <div class="mb-3">
                <label class="form-label" for="name">Nombre</label>
                <input type="text" name="name" id="name" class="form-control" maxlength="150" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" maxlength="100" autocomplete="off" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" autocomplete="new-password" required>
                <div class="form-text" id="ayudaPassword" hidden>Déjala vacía para conservar la actual.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="role">Rol</label>
                <select name="role" id="role" class="form-select">
                    <option value="admin">Administrador</option>
                    <option value="full_admin">Administrador Full</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success" id="guardar"><i class="bi bi-check2"></i> Guardar Usuario</button>
        </form>
    </div>
</main>

<script src="assets/js/datos.js"></script>
<script src="assets/js/iconos.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/usuario-form.js"></script>
</body>
</html>
