<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>Login | HSM WhatsApp</title>
</head>
<body class="login-body">
<main class="login-pantalla">
    <div class="login-tarjeta">
        <div class="login-marca">
            <span class="sidebar-logo"><i class="bi bi-whatsapp"></i></span>
            <div>
                <h1>HSM WhatsApp</h1>
                <p>Envío masivo de plantillas de WhatsApp</p>
            </div>
        </div>

        <div class="alert alert-danger py-2" id="errorLogin" hidden>
            Usuario o contraseña incorrectos
        </div>

        <form id="formLogin" novalidate>
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2">
                Iniciar Sesión
            </button>
        </form>

        <div class="login-demo">
            <div class="login-demo-titulo"><i class="bi bi-info-circle"></i> Accesos de demostración</div>
            <button type="button" class="login-demo-usuario" data-usuario="lmedina">
                <span><strong>lmedina</strong> · Administrador Full</span>
                <small>Plantillas, envíos y usuarios</small>
            </button>
            <button type="button" class="login-demo-usuario" data-usuario="dramirez">
                <span><strong>dramirez</strong> · Administrador</span>
                <small>Sin gestión de usuarios ni plantillas</small>
            </button>
            <p>Contraseña de ambos: <code>demo1234</code></p>
        </div>
    </div>
    <p class="login-pie">Demo con datos ficticios · Integración con Twilio WhatsApp Business API</p>
</main>

<script src="assets/js/datos.js"></script>
<script src="assets/js/iconos.js"></script>
<script>
(function () {
    'use strict';

    // Si ya hay sesión, entra directo (igual que el sistema)
    if (HSM.sesion()) {
        location.replace('campaigns.html');
        return;
    }

    const formulario = document.getElementById('formLogin');
    const usuario = document.getElementById('username');
    const password = document.getElementById('password');
    const error = document.getElementById('errorLogin');

    document.querySelectorAll('[data-usuario]').forEach(function (boton) {
        boton.addEventListener('click', function () {
            usuario.value = boton.dataset.usuario;
            password.value = 'demo1234';
            error.hidden = true;
            password.focus();
        });
    });

    formulario.addEventListener('submit', function (evento) {
        evento.preventDefault();
        const encontrado = HSM.datos().usuarios.find(function (u) {
            return u.username === usuario.value.trim() && u.status === 1;
        });

        if (!encontrado || encontrado.password !== password.value.trim()) {
            error.hidden = false;
            return;
        }

        encontrado.last_login = HSM.fechaSql(new Date());
        HSM.guardar();
        HSM.iniciarSesion(encontrado);
        location.href = 'campaigns.html';
    });
})();
</script>
</body>
</html>
